name: Build Scarlet Kernel (redwood)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: aafiqbinkhayer-Toshiro/scarlet_xiaomi_sm7325_-hackX
          ref: redwood
          path: kernel

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            build-essential python3 python-is-python3 curl git zip

      - name: Setup Neutron Clang via AntMan
        run: |
          mkdir -p "$HOME/neutron-clang"
          cd "$HOME/neutron-clang"
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S=latest
          echo "$HOME/neutron-clang/bin" >> $GITHUB_PATH

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: scarlet-redwood

      - name: Generate config
        working-directory: kernel
        run: |
          export PATH="$HOME/neutron-clang/bin:$PATH"
          make O=out ARCH=arm64 CC="ccache clang" xiaomi-qgki_defconfig redwood.config

      - name: Disable module signature verification
        working-directory: kernel
        run: |
          ./scripts/config --file out/.config \
            -d MODULE_SIG \
            -d MODULE_SIG_FORCE \
            -d MODULE_SIG_ALL \
            -d MODULE_SIG_SHA512
          export PATH="$HOME/neutron-clang/bin:$PATH"
          make O=out ARCH=arm64 CC="ccache clang" olddefconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="$HOME/neutron-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export KBUILD_BUILD_USER=aafiq
          export KBUILD_BUILD_HOST=github-actions
          make -j$(nproc --all) O=out ARCH=arm64 CC="ccache clang" \
            LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/ 2>/dev/null || true
          cd AnyKernel3
          zip -r9 ../Scarlet-redwood-$(date +%Y%m%d).zip * -x .git README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scarlet-redwood-kernel
          path: Scarlet-redwood-*.zip
