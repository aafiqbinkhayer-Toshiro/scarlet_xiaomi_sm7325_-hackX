name: Build Scarlet Kernel (redwood)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: aafiqbinkhayer-Toshiro/scarlet_xiaomi_sm7325_-hackX
          ref: redwood
          path: kernel

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            build-essential python3 python-is-python3 curl git zip

      - name: Setup Neutron Clang via AntMan
        run: |
          mkdir -p "$HOME/neutron-clang"
          cd "$HOME/neutron-clang"
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S=latest
          echo "$HOME/neutron-clang/bin" >> $GITHUB_PATH

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 2G
          key: scarlet-redwood

      - name: Generate config
        working-directory: kernel
        run: |
          export PATH="$HOME/neutron-clang/bin:$PATH"
          make O=out ARCH=arm64 CC="ccache clang" \
            vendor/xiaomi-qgki_defconfig vendor/redwood.config

      - name: Disable module signature verification
        working-directory: kernel
        run: |
          export PATH="$HOME/neutron-clang/bin:$PATH"
          ./scripts/config --file out/.config \
            -d MODULE_SIG \
            -d MODULE_SIG_FORCE \
            -d MODULE_SIG_ALL \
            -d MODULE_SIG_SHA512
          make O=out ARCH=arm64 CC="ccache clang" olddefconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="$HOME/neutron-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export KBUILD_BUILD_USER=aafiq
